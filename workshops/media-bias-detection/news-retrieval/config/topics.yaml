# Jerarquía temática del corpus (CLAUDE.md §8).
#
# IMPORTANTE — cómo se usa esto:
# Las keywords NO son parámetros de búsqueda. El discovery descarga el mes
# completo de cada medio y el etiquetado temático se aplica DESPUÉS, sobre
# título + URL + sección. Razón: los sitemaps no aceptan consultas, y filtrar
# durante el discovery haría irreproducible el corpus si más adelante cambian
# las keywords. Cambiar este archivo debe poder re-etiquetar el corpus existente
# sin volver a descargar nada.
#
# `match_on` indica contra qué campos se evalúan las keywords.
# El etiquetado es MULTI-ETIQUETA: un artículo puede pertenecer a varios temas.

settings:
  match_on: [title, url_path, section]
  case_sensitive: false
  strip_accents: true
  # Un artículo sin ningún tema NO se descarta: se guarda con topics = [].
  keep_untagged: true

