[project]
name = "news-corpus"
version = "0.1.0"
description = "Corpus histórico de noticias de medios tradicionales colombianos (2006–2026)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "typer>=0.15.1",
    "rich>=13.9.0",
    "python-dateutil>=2.9.0",
    "structlog>=24.4.0",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.34.0"]
export = ["pyarrow>=18.1.0", "pandas>=2.2.3"]
notebook = ["jupyterlab>=4.3.0", "matplotlib>=3.9.0", "pandas>=2.2.3"]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.4",
    "respx>=0.22.0",
]

[project.scripts]
news-corpus = "news_corpus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_corpus"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Los generadores de notebooks son plantillas de texto largas, no código de
# runtime; los .ipynb son su salida generada. Se lintea la fuente, no el artefacto.
extend-exclude = ["notebooks/_build_02.py", "notebooks/_build_03.py", "notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer.Option() en los defaults es el idioma de Typer, no un descuido.
"src/news_corpus/cli*.py" = ["B008"]
# El HTML de prueba se deja tal cual: partirlo alteraría el fixture.
"tests/test_extraction.py" = ["E501"]
# Estilo notebook: cada celda `# %%` importa lo suyo donde se usa.
"notebooks/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
